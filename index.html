<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESTEC Vacancy Watch</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2e; --panel2:#182238; --text:#eef3ff; --muted:#97a4bf; --line:#27334e; --accent:#67b7ff; --green:#65d49a; --amber:#f2c66d; --red:#ff7d86; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1020,#0e1425 38%,#0b1020);color:var(--text)}
    .wrap{max-width:1200px;margin:auto;padding:36px 20px 60px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h1{margin:5px 0 6px;font-size:clamp(30px,5vw,52px);letter-spacing:-.04em}.sub{color:var(--muted);max-width:720px}.updated{padding:12px 14px;background:rgba(103,183,255,.08);border:1px solid rgba(103,183,255,.25);border-radius:14px;color:#cfe9ff;white-space:nowrap}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 210px auto;gap:12px;padding:14px;background:rgba(18,26,46,.86);border:1px solid var(--line);border-radius:18px;position:sticky;top:10px;backdrop-filter:blur(14px);z-index:5}.toolbar input,.toolbar select{width:100%;background:#0e1628;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit}.check{display:flex;align-items:center;gap:9px;padding:0 6px;color:var(--muted);white-space:nowrap}.check input{accent-color:var(--accent)}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 2px}.pill{font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(18,26,46,.72)}.list{display:grid;gap:12px}.card{background:linear-gradient(180deg,rgba(24,34,56,.96),rgba(18,26,46,.96));border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;transition:.15s transform,.15s border-color}.card:hover{transform:translateY(-1px);border-color:#3c4f73}.topline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.company{font-size:13px;color:var(--accent);font-weight:800}.status{font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:4px 7px;border:1px solid var(--line)}.status.active{color:var(--green);border-color:rgba(101,212,154,.35)}.status.expired,.status.closed,.status.inactive{color:var(--red);border-color:rgba(255,125,134,.35)}.status.coming_soon{color:var(--amber);border-color:rgba(242,198,109,.35)}.title{font-size:21px;font-weight:800;margin:7px 0 5px;line-height:1.22}.meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}.assessment{margin:12px 0;color:#c8d2e6;line-height:1.55}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 7px;background:#0e1628;border:1px solid var(--line);border-radius:8px;color:#aebbd2}.score{min-width:95px;text-align:right}.score strong{font-size:28px}.score small{color:var(--muted)}.scorebar{height:6px;border-radius:99px;background:#0e1628;overflow:hidden;margin-top:8px}.scorebar i{display:block;height:100%;background:linear-gradient(90deg,#67b7ff,#65d49a);border-radius:99px}.open{display:inline-block;margin-top:12px;color:#d9ecff;text-decoration:none;font-weight:700}.open:hover{text-decoration:underline}.empty,.error{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.expired-card{opacity:.56}@media(max-width:760px){.hero{align-items:flex-start;flex-direction:column}.updated{white-space:normal}.toolbar{grid-template-columns:1fr}.card{grid-template-columns:1fr}.score{text-align:left}.scorebar{max-width:140px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div><div class="eyebrow">Space career dashboard</div><h1>ESTEC Vacancy Watch</h1><div class="sub">Relevant ESA, ESTEC contractor and Dutch space-engineering vacancies, ranked for Mats' mechanical / thermal / spacecraft-generalist profile.</div></div>
    <div class="updated" id="updated">Last update: loading…</div>
  </section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search title, employer, category…" />
    <select id="sort">
      <option value="fit-desc">Fit: high → low</option>
      <option value="fit-asc">Fit: low → high</option>
      <option value="posted-desc">Posted: newest first</option>
      <option value="closing-asc">Closing: soonest first</option>
      <option value="employer">Employer A → Z</option>
    </select>
    <label class="check"><input id="showExpired" type="checkbox" /> Show expired / closed</label>
  </section>

  <div class="summary" id="summary"></div>
  <section class="list" id="list"><div class="empty">Loading vacancies…</div></section>
</main>
<script>
const DATA_URL='estec_vacancies.json';
let data=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const parseDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?new Date(v+'T12:00:00'):null;
const expired=v=>['expired','closed','inactive'].includes((v.status||'').toLowerCase()) || (parseDate(v.closing_date)&&parseDate(v.closing_date)<new Date(new Date().toDateString()));
const fmt=v=>{if(!v)return '—'; const d=parseDate(v); return d?new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(d):v};
function uniqueVacancies(items){
  const map=new Map();
  for(const v of items){
    const normalizedUrl=(v.url||'').replace(/\/$/,'').toLowerCase();
    const key=normalizedUrl || `${(v.employer||'').trim().toLowerCase()}|${(v.title||'').trim().toLowerCase()}|${(v.location||'').trim().toLowerCase()}`;
    const old=map.get(key);
    if(!old) map.set(key,v); else map.set(key,{...old,...v,categories:[...new Set([...(old.categories||[]),...(v.categories||[])])]});
  }
  return [...map.values()];
}
function render(){
  const q=$('#search').value.trim().toLowerCase(); const showExpired=$('#showExpired').checked; const mode=$('#sort').value;
  let rows=data.filter(v=>showExpired||!expired(v)).filter(v=>!q||[v.title,v.employer,v.location,v.assessment,...(v.categories||[])].join(' ').toLowerCase().includes(q));
  const far=8640000000000000;
  rows.sort((a,b)=>{
    if(mode==='fit-desc')return (b.fit_score??-1)-(a.fit_score??-1);
    if(mode==='fit-asc')return (a.fit_score??99)-(b.fit_score??99);
    if(mode==='posted-desc')return (parseDate(b.posted)?.getTime()||0)-(parseDate(a.posted)?.getTime()||0);
    if(mode==='closing-asc')return (parseDate(a.closing_date)?.getTime()||far)-(parseDate(b.closing_date)?.getTime()||far);
    return (a.employer||'').localeCompare(b.employer||'');
  });
  const active=data.filter(v=>!expired(v)).length, ended=data.length-active;
  $('#summary').innerHTML=`<span class="pill">${rows.length} shown</span><span class="pill">${active} active / upcoming</span><span class="pill">${ended} expired / closed</span><span class="pill">${new Set(data.map(v=>v.employer)).size} employers</span>`;
  $('#list').innerHTML=rows.length?rows.map(v=>{
    const isExp=expired(v), score=Number(v.fit_score||0); return `<article class="card ${isExp?'expired-card':''}"><div><div class="topline"><span class="company">${esc(v.employer)}</span><span class="status ${esc(v.status||'unknown')}">${esc(v.status||'unknown')}</span></div><div class="title">${esc(v.title)}</div><div class="meta"><span>📍 ${esc(v.location||'—')}</span><span>Posted: ${fmt(v.posted)}</span><span>Closes: ${fmt(v.closing_date)}</span></div><div class="assessment">${esc(v.assessment||'')}</div><div class="tags">${(v.categories||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${v.url?`<a class="open" href="${esc(v.url)}" target="_blank" rel="noopener">Open vacancy ↗</a>`:''}</div><div class="score"><strong>${score.toFixed(1)}</strong><small> / 10 fit</small><div class="scorebar"><i style="width:${Math.max(0,Math.min(100,score*10))}%"></i></div></div></article>`
  }).join(''):'<div class="empty">No vacancies match these filters.</div>';
}
async function load(){
  try{const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status); const j=await r.json(); data=uniqueVacancies(j.vacancies||[]); const d=j.generated_at?new Date(j.generated_at):null; $('#updated').textContent='Last update: '+(d&&!isNaN(d)?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Amsterdam'}).format(d):j.generated_at||'unknown'); render();}
  catch(e){$('#updated').textContent='Last update: unavailable'; $('#list').innerHTML=`<div class="error">Could not load <code>${DATA_URL}</code>: ${esc(e.message)}</div>`;}
}
['search','sort','showExpired'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render)); load();
</script>
</body>
</html>
