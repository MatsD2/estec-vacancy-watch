<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESTEC Vacancy Watch</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--text:#eef3ff;--muted:#97a4bf;--line:#27334e;--accent:#67b7ff;--green:#65d49a;--amber:#f2c66d;--red:#ff7d86;--new:#7ee0ff}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1020,#0e1425 38%,#0b1020);color:var(--text)}
.wrap{width:min(1160px,calc(100% - 40px));margin:auto;padding:36px 0 60px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:22px}.hero-main{min-width:0;flex:1}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h1{margin:5px 0 6px;font-size:clamp(32px,5vw,52px);letter-spacing:-.04em;line-height:1.05}.sub{color:var(--muted);max-width:740px;line-height:1.5}.updated{flex:none;padding:12px 14px;background:rgba(103,183,255,.08);border:1px solid rgba(103,183,255,.25);border-radius:14px;color:#cfe9ff;white-space:nowrap}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 220px max-content;gap:12px;align-items:center;width:100%;padding:14px;background:rgba(18,26,46,.9);border:1px solid var(--line);border-radius:18px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(14px)}
.toolbar input[type="search"],.toolbar select{width:100%;min-width:0;height:44px;background:#0e1628;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:0 12px;font:inherit;font-size:15px}
.check{display:inline-flex;align-items:center;gap:9px;color:var(--muted);line-height:1.25;white-space:nowrap}.check input[type="checkbox"]{width:auto!important;height:auto!important;min-width:auto!important;margin:0;accent-color:var(--accent);flex:0 0 auto}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 2px}.pill{font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(18,26,46,.72)}
.companies{margin:18px 0 22px;background:rgba(18,26,46,.82);border:1px solid var(--line);border-radius:18px;overflow:hidden}.companies-head{appearance:none;width:100%;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 18px;text-align:left;cursor:pointer}.companies-head:hover{background:rgba(255,255,255,.015)}.companies-head-text{min-width:0}.section-title{font-size:18px;font-weight:800}.section-note{font-size:12px;color:var(--muted);margin-top:3px}.chevron{font-size:18px;color:var(--muted);transition:transform .18s ease;flex:none}.companies.open .chevron{transform:rotate(180deg)}.companies-body{display:none;border-top:1px solid var(--line);padding:16px 18px 18px}.companies.open .companies-body{display:block}.companies-controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px;flex-wrap:wrap}.company-group+.company-group{margin-top:15px}.group-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin-bottom:8px}.company-grid{display:flex;gap:8px;flex-wrap:wrap}.company-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:11px;background:#0e1628;color:#cbd5e8;font-size:12px}.company-logo{width:22px;height:22px;border-radius:6px;background:#fff;object-fit:contain;padding:2px;flex:none}.company-logo.large{width:28px;height:28px;border-radius:8px}
.list{display:grid;gap:12px}.card{width:100%;min-width:0;background:linear-gradient(180deg,rgba(24,34,56,.96),rgba(18,26,46,.96));border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:18px}.card.new-card{background:linear-gradient(180deg,rgba(21,57,75,.98),rgba(17,38,55,.98));border-color:rgba(126,224,255,.72);box-shadow:0 10px 32px rgba(60,185,225,.11)}.card-main{min-width:0}.topline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.employer-wrap{display:inline-flex;align-items:center;gap:8px;min-width:0}.company{font-size:13px;color:var(--accent);font-weight:800;overflow-wrap:anywhere}.status,.new-badge{font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:4px 7px;border:1px solid var(--line)}.status.active{color:var(--green);border-color:rgba(101,212,154,.35)}.status.expired,.status.closed,.status.inactive{color:var(--red);border-color:rgba(255,125,134,.35)}.status.coming_soon{color:var(--amber);border-color:rgba(242,198,109,.35)}.new-badge{font-weight:900;color:#dff8ff;background:rgba(126,224,255,.14);border-color:rgba(126,224,255,.5)}.title{font-size:21px;font-weight:800;margin:7px 0 5px;line-height:1.22;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px;display:flex;gap:8px 14px;flex-wrap:wrap}.assessment{margin:12px 0;color:#c8d2e6;line-height:1.55;overflow-wrap:anywhere}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 7px;background:#0e1628;border:1px solid var(--line);border-radius:8px;color:#aebbd2}.score{text-align:right;align-self:start}.score strong{font-size:28px}.score small{color:var(--muted)}.scorebar{height:6px;border-radius:99px;background:#0e1628;overflow:hidden;margin-top:8px}.scorebar i{display:block;height:100%;background:linear-gradient(90deg,#67b7ff,#65d49a)}.open{display:inline-block;margin-top:12px;color:#d9ecff;text-decoration:none;font-weight:700}.open:hover{text-decoration:underline}.empty,.error{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.expired-card{opacity:.56}.expired-card.new-card{opacity:.7}
@media(max-width:760px){
 .wrap{width:calc(100% - 24px);margin:0 12px;padding:22px 0 44px}.hero{display:block;margin-bottom:18px}.hero h1{font-size:36px}.sub{font-size:15px}.updated{display:inline-block;margin-top:14px;max-width:100%;white-space:normal;font-size:14px}
 .toolbar{position:static;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px}.toolbar input[type="search"],.toolbar select{font-size:16px}.toolbar .check{white-space:normal;padding:4px 2px}
 .summary{gap:8px;margin:14px 0}.pill{font-size:12px}.companies{margin:16px 0 20px}.companies-head{padding:14px}.companies-body{padding:14px}.companies-controls{display:grid;grid-template-columns:1fr;align-items:start;gap:10px}.companies-controls .check{white-space:normal}.company-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}.company-chip{width:100%}
 .card{grid-template-columns:minmax(0,1fr);gap:14px;padding:15px}.score{text-align:left;max-width:150px}.meta{display:grid;grid-template-columns:1fr;gap:5px}.title{font-size:20px}.assessment{font-size:14px}
}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div class="hero-main"><div class="eyebrow">Space career dashboard</div><h1>ESTEC Vacancy Watch</h1><div class="sub">Relevant ESA, ESTEC contractor and Dutch space-engineering vacancies, ranked for Mats' mechanical / thermal / spacecraft-generalist profile.</div></div><div class="updated" id="updated">Last update: loading…</div></section>
<section class="toolbar"><input id="search" type="search" placeholder="Search title, employer, category…"><select id="sort"><option value="fit-desc">Fit: high → low</option><option value="fit-asc">Fit: low → high</option><option value="posted-desc">Posted: newest first</option><option value="closing-asc">Closing: soonest first</option><option value="employer">Employer A → Z</option></select><label class="check"><input id="showExpired" type="checkbox"> Show expired / closed</label></section>
<div class="summary" id="summary"></div>
<section class="companies" id="companiesBox"><button class="companies-head" id="companiesToggle" type="button" aria-expanded="false"><div class="companies-head-text"><div class="section-title">Companies checked</div><div class="section-note">Organisations included in every vacancy-watch sweep.</div></div><span class="chevron">⌄</span></button><div class="companies-body"><div class="companies-controls"><div class="section-note" id="companyCount"></div><label class="check"><input id="showSecondary" type="checkbox" checked> Show Secondary watchlist</label></div><div id="companies"></div></div></section>
<section class="list" id="list"><div class="empty">Loading vacancies…</div></section>
</main>
<script>
const DATA_URL='estec_vacancies.json',NEW_WINDOW_MS=86400000;let data=[],currentScope={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const parseDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?new Date(v+'T12:00:00'):null;
const expired=v=>['expired','closed','inactive'].includes((v.status||'').toLowerCase())||(parseDate(v.closing_date)&&parseDate(v.closing_date)<new Date(new Date().toDateString()));
const isNew=v=>{if(!v.first_seen)return false;const t=new Date(v.first_seen).getTime(),age=Date.now()-t;return Number.isFinite(t)&&age>=0&&age<NEW_WINDOW_MS};
const fmt=v=>{if(!v)return'—';const d=parseDate(v);return d?new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(d):v};
const domains={'ESA':'esa.int','HE Space / SpaceForce':'hespace.com','CS Group / Sopra Steria':'soprasteria.com','ATG Europe':'atg-europe.com','Terma':'terma.com','Serco Europe':'serco.com','Telespazio Belgium':'telespazio.be','Starion / RHEA Group':'stariongroup.eu','Starion':'stariongroup.eu','Aurora Technology':'aurora.nl','SSC / Swedish Space Corporation':'sscspace.com','SSC Space':'sscspace.com','IABG / European Test Services (ETS)':'iabg.de','Axient Systems Netherlands':'axientcorp.com','SRON':'sron.nl','NLR':'nlr.org','Airbus Netherlands':'airbus.com','ISISPACE':'isispace.nl'};
function logoFor(n){const key=Object.keys(domains).find(k=>n?.toLowerCase().includes(k.toLowerCase()));const d=domains[n]||domains[key]||'esa.int';return`https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64`}
function uniqueVacancies(items){const map=new Map();for(const v of items){const u=(v.url||'').replace(/[?#].*$/,'').replace(/\/$/,'').toLowerCase(),fallback=`${(v.employer||'').trim().toLowerCase()}|${(v.title||'').trim().toLowerCase()}|${(v.location||'').trim().toLowerCase()}`,key=u||fallback,old=map.get(key);if(!old)map.set(key,v);else map.set(key,{...old,...v,first_seen:old.first_seen||v.first_seen,categories:[...new Set([...(old.categories||[]),...(v.categories||[])])]})}return[...map.values()]}
function renderCompanies(){const p=currentScope.primary||[],s=currentScope.secondary||[],showS=$('#showSecondary').checked;const chip=n=>`<span class="company-chip"><img class="company-logo" src="${logoFor(n)}" alt="" loading="lazy" onerror="this.style.display='none'">${esc(n)}</span>`;$('#companies').innerHTML=`<div class="company-group"><div class="group-label">Primary watchlist</div><div class="company-grid">${p.map(chip).join('')}</div></div>${showS?`<div class="company-group"><div class="group-label">Secondary watchlist</div><div class="company-grid">${s.map(chip).join('')}</div></div>`:''}`;$('#companyCount').textContent=`${p.length+(showS?s.length:0)} of ${new Set([...p,...s]).size} organisations shown`}
function render(){const q=$('#search').value.trim().toLowerCase(),showExpired=$('#showExpired').checked,mode=$('#sort').value;let rows=data.filter(v=>showExpired||!expired(v)).filter(v=>!q||[v.title,v.employer,v.location,v.assessment,...(v.categories||[])].join(' ').toLowerCase().includes(q));const far=8640000000000000;rows.sort((a,b)=>mode==='fit-desc'?(b.fit_score??-1)-(a.fit_score??-1):mode==='fit-asc'?(a.fit_score??99)-(b.fit_score??99):mode==='posted-desc'?(parseDate(b.posted)?.getTime()||0)-(parseDate(a.posted)?.getTime()||0):mode==='closing-asc'?(parseDate(a.closing_date)?.getTime()||far)-(parseDate(b.closing_date)?.getTime()||far):(a.employer||'').localeCompare(b.employer||''));const active=data.filter(v=>!expired(v)).length,ended=data.length-active,newCount=data.filter(isNew).length;$('#summary').innerHTML=`<span class="pill">${rows.length} shown</span><span class="pill">${active} active / upcoming</span><span class="pill">${ended} expired / closed</span><span class="pill">${newCount} new in last 24h</span><span class="pill">${new Set(data.map(v=>v.employer)).size} employers with matches</span>`;$('#list').innerHTML=rows.length?rows.map(v=>{const isExp=expired(v),fresh=isNew(v),score=Number(v.fit_score||0);return`<article class="card ${isExp?'expired-card':''} ${fresh?'new-card':''}"><div class="card-main"><div class="topline"><span class="employer-wrap"><img class="company-logo large" src="${logoFor(v.employer)}" alt="" loading="lazy" onerror="this.style.display='none'"><span class="company">${esc(v.employer)}</span></span><span class="status ${esc(v.status||'unknown')}">${esc(v.status||'unknown')}</span>${fresh?'<span class="new-badge">New · &lt;24h</span>':''}</div><div class="title">${esc(v.title)}</div><div class="meta"><span>📍 ${esc(v.location||'—')}</span><span>Posted: ${fmt(v.posted)}</span><span>Closes: ${fmt(v.closing_date)}</span></div><div class="assessment">${esc(v.assessment||'')}</div><div class="tags">${(v.categories||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${v.url?`<a class="open" href="${esc(v.url)}" target="_blank" rel="noopener">Open vacancy ↗</a>`:''}</div><div class="score"><strong>${score.toFixed(1)}</strong><small> / 10 fit</small><div class="scorebar"><i style="width:${Math.max(0,Math.min(100,score*10))}%"></i></div></div></article>`}).join(''):'<div class="empty">No vacancies match these filters.</div>'}
async function load(){try{const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();data=uniqueVacancies(j.vacancies||[]);currentScope=j.scope||{};renderCompanies();const d=j.generated_at?new Date(j.generated_at):null;$('#updated').textContent='Last update: '+(d&&!isNaN(d)?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Amsterdam'}).format(d):j.generated_at||'unknown');render()}catch(e){$('#updated').textContent='Last update: unavailable';$('#list').innerHTML=`<div class="error">Could not load ${esc(e.message)}</div>`}}
$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);$('#showExpired').addEventListener('change',render);$('#showSecondary').addEventListener('change',renderCompanies);$('#companiesToggle').addEventListener('click',()=>{const box=$('#companiesBox'),open=box.classList.toggle('open');$('#companiesToggle').setAttribute('aria-expanded',String(open))});load();
</script>
</body>
</html>
