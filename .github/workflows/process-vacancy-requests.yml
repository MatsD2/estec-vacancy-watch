name: Process vacancy requests

on:
  push:
    paths:
      - 'data/requests/*.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply requests
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const allowed=new Set(['esa.json','telespazio.json','atg.json','starion.json','ssc.json','he-space.json','terma-serco.json','ets-axient.json','secondary.json','other.json']);
          const dir='data/requests';
          if(!fs.existsSync(dir)) process.exit(0);
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('.json'));
          for(const file of files){
            const rp=path.join(dir,file), req=JSON.parse(fs.readFileSync(rp,'utf8'));
            if(!req||!allowed.has(req.shard)||!req.vacancy||typeof req.vacancy!=='object') throw new Error('Invalid request '+file);
            const p='data/vacancies/'+req.shard, db=JSON.parse(fs.readFileSync(p,'utf8')), v=req.vacancy;
            if(!Array.isArray(db.vacancies)) throw new Error('Invalid shard '+req.shard);
            const canon=u=>String(u||'').split('#')[0].replace(/[?&](utm_[^=&]+|ref|source)=[^&]*/g,'').replace(/[?&]$/,'').replace(/\/$/,'');
            const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
            let i=db.vacancies.findIndex(x=>v.url&&x.url&&canon(x.url)===canon(v.url));
            if(i<0&&v.previous_url){i=db.vacancies.findIndex(x=>x.url&&canon(x.url)===canon(v.previous_url)&&norm(x.employer)===norm(v.employer));}
            if(i<0&&(v.job_id||v.requisition_id)){
              const id=norm(v.job_id||v.requisition_id);
              i=db.vacancies.findIndex(x=>norm(x.employer)===norm(v.employer)&&norm(x.title)===norm(v.title)&&norm(x.job_id||x.requisition_id)===id);
            }
            if(i>=0){const old=db.vacancies[i];const {previous_url,...clean}=v;db.vacancies[i]={...old,...clean};if(old.first_seen)db.vacancies[i].first_seen=old.first_seen;}
            else {if(!v.title||!v.employer||!v.url)throw new Error('New vacancy missing identity');const {previous_url,...clean}=v;db.vacancies.push(clean);}
            // Collapse duplicate records sharing the same employer, title and requisition ID.
            // A refreshed PDF cache-buster or a slightly changed location must not create a second vacancy.
            if(v.job_id||v.requisition_id){
              const id=norm(v.job_id||v.requisition_id), matches=[];
              db.vacancies.forEach((x,j)=>{
                if(norm(x.employer)===norm(v.employer)&&norm(x.title)===norm(v.title)&&norm(x.job_id||x.requisition_id)===id)matches.push(j);
              });
              if(matches.length>1){
                const firstSeen=matches.map(j=>db.vacancies[j].first_seen).filter(Boolean).sort((a,b)=>Date.parse(a)-Date.parse(b))[0];
                db.vacancies[matches[0]]={...db.vacancies[matches[0]],...db.vacancies[matches[matches.length-1]]};
                if(firstSeen)db.vacancies[matches[0]].first_seen=firstSeen;
                const remove=new Set(matches.slice(1));
                db.vacancies=db.vacancies.filter((_,j)=>!remove.has(j));
              }
            }
            fs.writeFileSync(p,JSON.stringify(db,null,2)+'\n');
            fs.unlinkSync(rp);
          }
          NODE
      - name: Commit
        run: |
          git config user.name "estec-vacancy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vacancies/ data/requests/
          if ! git diff --cached --quiet; then
            git commit -m "Process vacancy update requests"
            git push origin HEAD:main
          fi
